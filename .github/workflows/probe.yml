name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: sherpa-onnx release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/k2-fsa/sherpa-onnx/releases/latest --jq '.tag_name, (.assets[]|select(.name|test("aar|android|jar"))|"\(.name) \(.size) \(.browser_download_url)")' | head -40
      - name: AAR classes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh api repos/k2-fsa/sherpa-onnx/releases/latest --jq '[.assets[]|select(.name|test("\\.aar$"))][0].browser_download_url')
          echo "AAR=$URL"
          curl -sSL -o s.aar "$URL" && ls -l s.aar && unzip -o -q s.aar -d aar && find aar -maxdepth 3 | head -40 && ls -l aar/jni/* | head -40
          cd aar && unzip -o -q classes.jar -d cls && find cls -name '*.class' | sed 's#cls/##' | sort | head -150
          for c in OfflineRecognizer OfflineRecognizerConfig OfflineModelConfig OfflineMoonshineModelConfig OfflineStream OfflineRecognizerResult FeatureConfig; do echo "=== $c"; javap -cp cls -p com.k2fsa.sherpa.onnx.$c || true; done
      - name: model files
        run: |
          B=https://huggingface.co/udgamlabs/Shruti-ONNX/resolve/main
          curl -sSL "https://huggingface.co/api/models/udgamlabs/Shruti-ONNX/tree/main/pa" | head -c 1500; echo
          curl -sSL "https://huggingface.co/api/models/udgamlabs/Shruti-ONNX/tree/main/pa/sherpa-onnx" | head -c 3000; echo
          mkdir -p m && cd m
          for f in preprocess.onnx encode.onnx uncached_decode.onnx cached_decode.onnx tokens.txt; do curl -sSL -o $f "$B/pa/sherpa-onnx/$f"; done
          ls -l; head -c 300 tokens.txt; echo; wc -l tokens.txt
          curl -sSL "$B/NOTICE" | head -30 || true
      - name: recognition test
        run: |
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip -q install sherpa-onnx soundfile numpy edge-tts
          T1="ਸੋਚੈ ਸੋਚਿ ਨ ਹੋਵਈ ਜੇ ਸੋਚੀ ਲਖ ਵਾਰ"
          T2="ਹੁਕਮਿ ਰਜਾਈ ਚਲਣਾ ਨਾਨਕ ਲਿਖਿਆ ਨਾਲਿ"
          T3="ਮੈਂ ਅੱਜ ਸਵੇਰੇ ਗੁਰਦੁਆਰੇ ਗਿਆ ਸੀ ਅਤੇ ਉੱਥੇ ਕੀਰਤਨ ਸੁਣਿਆ"
          espeak-ng -v pa -s 130 -w e1.wav "$T1" || true
          i=1; for t in "$T1" "$T2" "$T3"; do edge-tts --voice pa-IN-OjasNeural --text "$t" --write-media t$i.mp3 || true; i=$((i+1)); done
          for f in e1.wav t1.mp3 t2.mp3 t3.mp3; do [ -s $f ] && ffmpeg -loglevel error -y -i $f -ar 16000 -ac 1 ${f%.*}_16.wav; done
          ls -l *.wav || true
          cat > t.py <<'PY'
          import sherpa_onnx, soundfile as sf, glob, time
          d="m/"
          rec=sherpa_onnx.OfflineRecognizer.from_moonshine(preprocessor=d+"preprocess.onnx",encoder=d+"encode.onnx",uncached_decoder=d+"uncached_decode.onnx",cached_decoder=d+"cached_decode.onnx",tokens=d+"tokens.txt",num_threads=2)
          for f in sorted(glob.glob("*_16.wav")):
              s,r=sf.read(f,dtype="float32"); t=time.time()
              st=rec.create_stream(); st.accept_waveform(r,s); rec.decode_stream(st)
              print(f, round(len(s)/r,1),"s audio,", round(time.time()-t,2),"s decode ->", st.result.text)
          PY
          python t.py
