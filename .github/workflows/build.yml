name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The full scripture is downloaded once and packed inside the APK.
      - name: Restore scripture cache
        uses: actions/cache@v4
        with:
          path: src/main/assets/corpus.json
          key: corpus-v1

      - name: Download scripture (first build only)
        run: |
          if [ ! -s src/main/assets/corpus.json ]; then
            node scripts/fetch-corpus.mjs
          fi

      # Fonts are packed inside the APK too.
      - name: Download fonts
        run: |
          node scripts/fetch-fonts.mjs
          ls -lh src/main/assets/ src/main/assets/fonts/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Play Store upload key (repository secret UPLOAD_KEYSTORE_B64). Optional: without it
      # the build still makes a debug APK, but no Play Store bundle.
      - name: Restore upload key
        id: key
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UPLOAD_KEYSTORE_B64 secret is not set - building a debug APK only (no Play Store bundle)."
          fi

      - name: Build signed APK and Play Store bundle
        if: steps.key.outputs.signed == 'true'
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace
          cp build/outputs/apk/release/*.apk Gurbani.apk
          cp build/outputs/bundle/release/*.aab Gurbani.aab

      - name: Build debug APK
        if: steps.key.outputs.signed != 'true'
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp build/outputs/apk/debug/*.apk Gurbani.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gurbani-apk
          path: |
            Gurbani.apk
            Gurbani.aab

      - name: Publish to Releases (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="Gurbani.apk"; [ -f Gurbani.aab ] && FILES="$FILES Gurbani.aab"
          gh release delete latest --cleanup-tag -y || true
          gh release create latest $FILES \
            --title "Gurbani build ${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }} (version code ${{ github.run_number }}). Gurbani.apk installs directly on a phone; Gurbani.aab is the file to upload to Google Play Console." \
            --target "${{ github.sha }}"
