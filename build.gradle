plugins {
    id 'com.android.application' version '8.11.1'
}

android {
    namespace 'com.guruvani.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.guruvani.app'
        minSdk 26
        targetSdk 36
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Play Store builds are signed with the upload key that CI restores from the
    // UPLOAD_KEYSTORE_B64 repository secret. Without it, only debug builds are made.
    def ksFile = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword 'gurbani-upload'
                keyAlias 'upload'
                keyPassword 'gurbani-upload'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    // Google Play subscription
    implementation 'com.android.billingclient:billing:9.1.0'
    // keeps the Kotlin runtime pieces pulled in by the libraries on one version
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
